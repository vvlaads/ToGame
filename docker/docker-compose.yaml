name: togame
services:
  postgres:
    image: postgres:latest
    container_name: togame_db
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=togame
    # volumes:
    #   - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql      